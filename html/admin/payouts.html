<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayBee Admin | Payout Management</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-paybee-black text-white min-h-screen flex">

    <!-- Sidebar -->
    <aside class="sidebar h-screen sticky top-0 flex flex-col hidden lg:flex">
        <div class="p-6 border-b border-paybee-green/10 flex items-center gap-3">
            <img src="/paybee_logo.png" alt="PayBee" class="w-10 h-10 object-contain">
            <div>
                <span class="font-display font-bold tracking-tighter text-lg">PAYBEE</span>
                <span class="block text-[10px] text-paybee-green -mt-1 font-bold">CONTROL CENTER</span>
            </div>
        </div>

        <nav class="flex-1 mt-6">
            <a href="admin-dashboard.html" class="sidebar-link">
                <i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i>
                Dashboard
            </a>
            <a href="users.html" class="sidebar-link">
                <i data-lucide="users" class="w-5 h-5 mr-3"></i>
                Users
            </a>
            <a href="deposits.html" class="sidebar-link">
                <i data-lucide="arrow-down-circle" class="w-5 h-5 mr-3"></i>
                Deposits
            </a>
            <a href="payouts.html" class="sidebar-link active">
                <i data-lucide="arrow-up-circle" class="w-5 h-5 mr-3"></i>
                Payouts
            </a>
            <a href="trades.html" class="sidebar-link">
                <i data-lucide="repeat" class="w-5 h-5 mr-3"></i>
                Trades
            </a>
            <a href="#" class="sidebar-link">
                <i data-lucide="settings" class="w-5 h-5 mr-3"></i>
                Settings
            </a>
        </nav>

        <div class="p-6 border-t border-paybee-green/10">
            <button id="logout-btn" class="flex items-center text-slate-500 hover:text-red-500 transition-colors w-full">
                <i data-lucide="log-out" class="w-5 h-5 mr-3"></i>
                System Exit
            </button>
        </div>
    </aside>

    <main class="flex-1 min-w-0">
        <header class="glass-header h-16 flex items-center justify-between px-8 sticky top-0 z-50">
            <div class="flex items-center gap-4">
                <button class="lg:hidden p-2"><i data-lucide="menu"></i></button>
                <div class="text-xs uppercase tracking-widest text-slate-500 font-bold">Terminal / Payouts</div>
            </div>
        </header>

        <div class="p-8">
            <div class="mb-10 animate-fade-in">
                <h1 class="text-3xl font-bold tracking-tight mb-2">PAYOUT <span class="text-paybee-green">SETTLEMENT</span></h1>
                <p class="text-slate-500">Manage user withdrawals to bank accounts and fiat gateways.</p>
            </div>

            <div class="glass rounded-2xl overflow-hidden animate-fade-in">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>USER</th>
                                <th>BANK DETAILS</th>
                                <th>AMOUNT</th>
                                <th>STATUS</th>
                                <th>ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody id="payouts-table-body">
                            <!-- Populated by app.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="./app.js"></script>
</body>
</html>
