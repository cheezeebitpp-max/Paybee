<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayBee Admin | User Management</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-paybee-black text-white min-h-screen flex">

    <!-- Sidebar -->
    <aside class="sidebar h-screen sticky top-0 flex flex-col hidden lg:flex">
        <div class="p-6 border-b border-paybee-green/10 flex items-center gap-3">
            <img src="/paybee_logo.png" alt="PayBee" class="w-10 h-10 object-contain">
            <div>
                <span class="font-display font-bold tracking-tighter text-lg">PAYBEE</span>
                <span class="block text-[10px] text-paybee-green -mt-1 font-bold">CONTROL CENTER</span>
            </div>
        </div>

        <nav class="flex-1 mt-6">
            <a href="admin-dashboard.html" class="sidebar-link">
                <i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i>
                Dashboard
            </a>
            <a href="users.html" class="sidebar-link active">
                <i data-lucide="users" class="w-5 h-5 mr-3"></i>
                Users
            </a>
            <a href="deposits.html" class="sidebar-link">
                <i data-lucide="arrow-down-circle" class="w-5 h-5 mr-3"></i>
                Deposits
            </a>
            <a href="payouts.html" class="sidebar-link">
                <i data-lucide="arrow-up-circle" class="w-5 h-5 mr-3"></i>
                Payouts
            </a>
            <a href="trades.html" class="sidebar-link">
                <i data-lucide="repeat" class="w-5 h-5 mr-3"></i>
                Trades
            </a>
            <a href="#" class="sidebar-link">
                <i data-lucide="settings" class="w-5 h-5 mr-3"></i>
                Settings
            </a>
        </nav>

        <div class="p-6 border-t border-paybee-green/10">
            <button id="logout-btn" class="flex items-center text-slate-500 hover:text-red-500 transition-colors w-full">
                <i data-lucide="log-out" class="w-5 h-5 mr-3"></i>
                System Exit
            </button>
        </div>
    </aside>

    <main class="flex-1 min-w-0">
        <header class="glass-header h-16 flex items-center justify-between px-8 sticky top-0 z-50">
            <div class="flex items-center gap-4">
                <button class="lg:hidden p-2"><i data-lucide="menu"></i></button>
                <div class="text-xs uppercase tracking-widest text-slate-500 font-bold">Terminal / Users</div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleModal('create-user-modal')" class="btn-primary py-1.5 px-4 text-xs font-bold flex items-center gap-2">
                    <i data-lucide="user-plus" class="w-4 h-4"></i>
                    CREATE USER
                </button>
                <div class="glass flex items-center px-3 py-1.5 rounded-lg border border-paybee-green/20">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 mr-2"></i>
                    <input type="text" placeholder="Search Users..." class="bg-transparent border-none text-xs text-white focus:outline-none w-48">
                </div>
            </div>
        </header>

        <div class="p-8">
            <div class="mb-10 flex justify-between items-end">
                <div>
                    <h1 class="text-3xl font-bold tracking-tight mb-2">USER <span class="text-paybee-green">BASE</span></h1>
                    <p class="text-slate-500">Manage and monitor PayBee platform participants.</p>
                </div>
            </div>

            <!-- Create User Modal -->
            <div id="create-user-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                <div class="glass max-w-md w-full p-8 rounded-2xl animate-fade-in border-paybee-green/30">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-paybee-green">IDENTITY PROVISIONING</h2>
                        <button onclick="toggleModal('create-user-modal')" class="text-slate-500 hover:text-white"><i data-lucide="x"></i></button>
                    </div>
                    <form id="create-user-form">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs uppercase text-slate-500 mb-1">Full Name</label>
                                <input type="text" name="fullName" required class="w-full bg-paybee-black border border-paybee-green/20 rounded-lg p-3 text-white focus:outline-none focus:border-paybee-green text-sm">
                            </div>
                            <div>
                                <label class="block text-xs uppercase text-slate-500 mb-1">Email Address</label>
                                <input type="email" name="email" required class="w-full bg-paybee-black border border-paybee-green/20 rounded-lg p-3 text-white focus:outline-none focus:border-paybee-green text-sm">
                            </div>
                            <div>
                                <label class="block text-xs uppercase text-slate-500 mb-1">Initial Password</label>
                                <input type="password" name="password" required class="w-full bg-paybee-black border border-paybee-green/20 rounded-lg p-3 text-white focus:outline-none focus:border-paybee-green text-sm">
                            </div>
                            <div class="pt-4">
                                <button type="submit" class="w-full btn-primary py-3 text-sm font-bold tracking-widest">
                                    EXECUTE PROVISIONING
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="glass rounded-2xl overflow-hidden animate-fade-in">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>IDENTITY</th>
                                <th>EMAIL</th>
                                <th>WALLET BALANCE</th>
                                <th>KYC STATUS</th>
                                <th>ACCOUNT</th>
                                <th>ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <!-- Populated by app.js -->
                            <tr>
                                <td colspan="6" class="text-center py-20 text-slate-500">
                                    <div class="animate-pulse">Loading User Terminal...</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="./app.js"></script>
</body>
</html>
